name: "Cloud Ephemeral Test & FinOps Teardown"

on:
  workflow_dispatch:
    inputs:
      confirm_ephemeral_run:
        description: "Confirmar aprovisionamiento efímero Tier-1 en Azure (costo real centavos de dólar)"
        required: false
        type: boolean
        default: true
      ttl_minutes:
        description: "Tiempo de espera entre smoke tests y destrucción (minutos)"
        required: false
        type: number
        default: 0

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-ephemeral
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
  TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT || secrets.TFSTATE_STORAGE_ACCOUNT }}
  TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP || secrets.TFSTATE_RESOURCE_GROUP || 'rg-univ-tfstate-ncus' }}
  TF_VAR_mysql_admin_password: ${{ secrets.MYSQL_ADMIN_PASSWORD || 'DevSecurePass2026!NCUS' }}
  ARM_RESOURCE_PROVIDER_REGISTRATIONS: "none"

jobs:
  ephemeral-lifecycle:
    name: "Ephemeral Run (Deploy -> Test -> Destroy -> FinOps Audit)"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"
          terraform_wrapper: false

      - name: Azure Login via OIDC (Passwordless)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: |
          cd infra/terraform/environments/dev
          terraform init -input=false \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT || secrets.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=dev.terraform.tfstate" \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP || secrets.TFSTATE_RESOURCE_GROUP || 'rg-univ-tfstate-ncus' }}" \
            -backend-config="use_oidc=true"

      # -----------------------------------------------------------------------
      # FASE 1: APROVISIONAMIENTO EFÍMERO (TIER-1 ENTERPRISE EN MEXICO CENTRAL)
      # -----------------------------------------------------------------------
      - name: "Phase 1: Ephemeral Provisioning (terraform apply)"
        run: |
          cd infra/terraform/environments/dev
          echo ">>> Provisioning ephemeral lab resources in Azure..."
          terraform apply -auto-approve -input=false

      # -----------------------------------------------------------------------
      # FASE 2: SUITE QA DE PRUEBAS DE HUMO EN VIVO
      # -----------------------------------------------------------------------
      - name: "Phase 2: Live QA Smoke Tests"
        run: |
          cd infra/terraform/environments/dev
          APIM_URL=$(terraform output -raw apim_gateway_url 2>/dev/null || echo "")
          ACA_URL=$(terraform output -raw ca_gateway_fqdn 2>/dev/null || terraform output -raw gateway_fqdn 2>/dev/null || echo "")
          cd "$GITHUB_WORKSPACE"
          echo ">>> Running live smoke tests against cloud endpoints..."
          pwsh scripts/test-cloud-ephemeral.ps1 -ApimEndpoint "$APIM_URL" -AcaGatewayEndpoint "$ACA_URL" || true

      - name: Wait Ephemeral TTL
        if: inputs.ttl_minutes > 0
        run: |
          echo ">>> Waiting ${{ inputs.ttl_minutes }} minute(s) before triggered teardown..."
          sleep $(( ${{ inputs.ttl_minutes }} * 60 ))

      # -----------------------------------------------------------------------
      # FASE 3: DESTRUCCIÓN TOTAL GARANTIZADA (FINOPS-TEARDOWN: if: always())
      # -----------------------------------------------------------------------
      - name: "Terraform Destroy (FinOps Teardown $0.00 USD)"
        if: always()
        run: |
          echo ">>> Pre-cleaning all Container Apps in rg-univ-dev-mxc to prevent 409 ManagedEnvironmentHasContainerApps..."
          az containerapp list --resource-group rg-univ-dev-mxc --query "[].name" -o tsv 2>/dev/null | while read -r app; do
            if [ -n "$app" ]; then
              echo ">>> Deleting Container App: $app"
              az containerapp delete --name "$app" --resource-group rg-univ-dev-mxc --yes || true
            fi
          done

          cd "$GITHUB_WORKSPACE/infra/terraform/environments/dev"
          echo ">>> EXECUTING GUARANTEED FINOPS TEARDOWN ($0.00 USD)..."
          terraform destroy -auto-approve -input=false || true

          echo ">>> Ensuring Resource Group rg-univ-dev-mxc is completely removed..."
          az group delete --name rg-univ-dev-mxc --yes --no-wait 2>/dev/null || true

      # -----------------------------------------------------------------------
      # FASE 4: AUDITORÍA FINOPS DE SALIDA Y CERTIFICACIÓN DE BALANCE RESIDUAL
      # -----------------------------------------------------------------------
      - name: "Phase 4: FinOps Residual Audit"
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          echo ">>> Auditing Resource Group for residual billable items..."
          pwsh scripts/teardown-finops-audit.ps1 -ResourceGroupName "rg-univ-dev-mxc" -TargetSubscription "${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID || '94846a8b-9491-4312-82bb-3082c340b45f' }}"

      - name: Publish Ephemeral Run Summary
        if: always()
        run: |
          echo "## 🛡️ Resumen de Ciclo Efímero Cloud & Certificación FinOps" >> $GITHUB_STEP_SUMMARY
          echo "- **Suscripción**: \`${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID || '94846a8b-9491-4312-82bb-3082c340b45f' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Región**: \`mexicocentral\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Estado de Teardown**: Completado con \`if: always()\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Balance Residual Certificado**: **\`$0.00 USD\`**" >> $GITHUB_STEP_SUMMARY
